# Defines the baseline + generalization-subset simulation design.
# See FUS_Project_Full_Plan_and_Executive_Summary.md and the project plan for rationale.

baseline:
  # Run for every subject in the cohort.
  target: VIM_thalamus     # ventral intermediate nucleus (essential tremor) -- most
                            # common tcMRgFUS target in clinical practice (Exablate Neuro).
                            # NOTE: per-subject target coordinates are currently picked by
                            # visual inspection (see scripts/run_skull_simulation.py), not
                            # atlas registration -- fine for the one-subject pipeline proof
                            # of concept, but atlas-based auto-targeting is required before
                            # scaling to the full 150-300 subject cohort (Phase 2).
  frequency_hz: 650000     # matches Insightec Exablate Neuro's clinical frequency
  transducer:
    type: single_element_focused_bowl
    radius_of_curvature_mm: 63.2   # matches Sonic Concepts CTX-500 bowl geometry (single
    aperture_diameter_mm: 64.0     # continuous element, uniform phase -- not the CTX-500's
                                    # actual 4-ring annular array)

generalization:
  # Run only on a subset of subjects, one axis varied at a time.
  subset_size: 40
  additional_targets: []          # TODO: list of alternate target coordinates
  additional_frequencies_hz: []   # TODO: list of alternate frequencies
  additional_transducers: []      # TODO: list of alternate transducer specs

cohort:
  n_subjects_target: 200   # 150-300 range per project plan
  source_dataset: IXI
